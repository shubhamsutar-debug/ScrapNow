<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    ScrapNow favicon — Universal Recycling Symbol
    Three chasing-arrow arms rotated 120° apart, two-tone green.
  -->
  <defs>
    <path
      id="fav-arm"
      d="
        M 50 5
        L 40 5  L 20 43  L 30 43
        L 30 54 L 38 54  L 38 46
        L 62 46 L 62 54  L 70 54
        L 70 43 L 80 43
        L 60 5
        Z
      "
    />
  </defs>

  <!-- Arm 1 -->
  <use href="#fav-arm" fill="#4CAF50"/>
  <path d="M 50 5 L 40 5 L 20 43 L 30 43 L 30 54 L 38 54 L 38 46 L 50 46 Z"
        fill="#2E7D32" opacity="0.4"/>

  <!-- Arm 2 (120°) -->
  <g transform="rotate(120 50 50)">
    <use href="#fav-arm" fill="#4CAF50"/>
    <path d="M 50 5 L 40 5 L 20 43 L 30 43 L 30 54 L 38 54 L 38 46 L 50 46 Z"
          fill="#2E7D32" opacity="0.4"/>
  </g>

  <!-- Arm 3 (240°) -->
  <g transform="rotate(240 50 50)">
    <use href="#fav-arm" fill="#4CAF50"/>
    <path d="M 50 5 L 40 5 L 20 43 L 30 43 L 30 54 L 38 54 L 38 46 L 50 46 Z"
          fill="#2E7D32" opacity="0.4"/>
  </g>
</svg>
